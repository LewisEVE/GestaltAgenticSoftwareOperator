[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gestalt-core"
version = "1.0.0"
description = "Production-grade headless multi-agent software operations framework built on a single LangGraph super-graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Cursor Cloud Agent" },
]
keywords = [
  "agents",
  "langgraph",
  "fastapi",
  "observability",
  "operations",
  "saas",
]
dependencies = [
  "aiosqlite>=0.21.0",
  "apscheduler>=3.11.0,<4.0.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0,<1.0.0",
  "greenlet>=3.2.0",
  "httpx>=0.28.0",
  "langchain>=0.3.0,<0.4.0",
  "langgraph>=0.3.0,<0.4.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "litellm>=1.65.0",
  "neo4j>=5.28.0",
  "opentelemetry-api>=1.33.0",
  "opentelemetry-exporter-otlp>=1.33.0",
  "opentelemetry-instrumentation-fastapi>=0.54b0",
  "opentelemetry-sdk>=1.33.0",
  "pgvector>=0.3.0",
  "prometheus-client>=0.21.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=3.2.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gestalt"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "ASYNC",
  "C4",
  "DTZ",
  "G",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
]
ignore = [
  "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["gestalt", "tests"]
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
