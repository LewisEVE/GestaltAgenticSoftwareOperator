apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestalt-core
  namespace: gestalt-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestalt-core
  template:
    metadata:
      labels:
        app: gestalt-core
    spec:
      containers:
        - name: gestalt-core
          image: gestalt-core:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gestalt-core-config
            - secretRef:
                name: gestalt-core-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
